<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Fun Fact Generator</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #e2e8f0;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Animated background particles */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(118, 75, 162, 0.1) 0%, transparent 40%);
      animation: float 20s infinite ease-in-out;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-20px, -20px) scale(1.05); }
      66% { transform: translate(20px, -10px) scale(0.95); }
    }

    .app-container {
      background: rgba(15, 12, 41, 0.6);
      border-radius: 24px;
      max-width: 500px;
      width: 100%;
      padding: 35px 30px;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(102, 126, 234, 0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(102, 126, 234, 0.3);
      transform: perspective(1000px) rotateX(5deg);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .app-container:hover {
      transform: perspective(1000px) rotateX(0deg);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(102, 126, 234, 0.4);
    }

    h1 {
      font-size: 2.6rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #a78bfa 50%, #667eea 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      letter-spacing: 1px;
      animation: neonGlow 3s ease-in-out infinite alternate;
      text-shadow: 
        0 0 10px rgba(102, 126, 234, 0.5),
        0 0 20px rgba(167, 139, 250, 0.3);
    }

    @keyframes neonGlow {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.2); }
    }

    .subtitle {
      font-weight: 300;
      color: #a0aec0;
      margin-bottom: 35px;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }

    .fact-card {
      background: rgba(30, 30, 46, 0.4);
      border-radius: 16px;
      padding: 30px 25px;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 0 12px rgba(102, 126, 234, 0.1);
      margin-bottom: 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 180px;
      opacity: 1;
      transition: all 0.4s ease;
      position: relative;
      border: 1px solid rgba(102, 126, 234, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }

    .fact-card:active {
      cursor: grabbing;
    }

    .fact-card.swipe-left {
      animation: swipeLeft 0.6s ease-out forwards;
    }

    .fact-card.swipe-right {
      animation: swipeRight 0.6s ease-out forwards;
    }

    @keyframes swipeLeft {
      0% { transform: translateX(0) rotate(0deg); opacity: 1; }
      50% { transform: translateX(-30px) rotate(-5deg); }
      100% { transform: translateX(-100vw) rotate(-15deg); opacity: 0; }
    }

    @keyframes swipeRight {
      0% { transform: translateX(0) rotate(0deg); opacity: 1; }
      50% { transform: translateX(30px) rotate(5deg); }
      100% { transform: translateX(100vw) rotate(15deg); opacity: 0; }
    }

    .fact-icon {
      font-size: 4.5rem;
      margin-bottom: 20px;
      color: #a78bfa;
      user-select: none;
      animation: bounce 3s infinite ease-in-out;
      filter: drop-shadow(0 0 8px rgba(167, 139, 250, 0.5));
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .fact-category {
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      color: #667eea;
      letter-spacing: 2px;
      margin-bottom: 15px;
      position: relative;
      text-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
    }

    .fact-category::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 45px;
      height: 2px;
      background: linear-gradient(90deg, #667eea, #a78bfa);
      border-radius: 2px;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
    }

    .fact-text {
      font-size: 1.2rem;
      line-height: 1.7;
      color: #e2e8f0;
      max-width: 400px;
      user-select: none;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .refresh-btn {
      background: linear-gradient(135deg, #667eea 0%, #a78bfa 100%);
      border: none;
      padding: 16px 45px;
      border-radius: 50px;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 
        0 10px 25px rgba(102, 126, 234, 0.4),
        0 0 15px rgba(167, 139, 250, 0.3);
      position: relative;
      overflow: hidden;
      min-height: 60px;
      min-width: 200px;
      touch-action: manipulation;
    }

    .refresh-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s;
    }

    .refresh-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 
        0 15px 35px rgba(102, 126, 234, 0.6),
        0 0 20px rgba(167, 139, 250, 0.4);
    }

    .refresh-btn:hover::before {
      left: 100%;
    }

    .refresh-btn:active {
      transform: translateY(-2px) scale(0.95);
    }

    .refresh-btn:disabled {
      background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      opacity: 0.7;
    }

    /* Touch ripple effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      transform: scale(0);
      animation: ripple-animation 0.6s ease-out;
      pointer-events: none;
    }

    @keyframes ripple-animation {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      color: #a78bfa;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(30, 30, 46, 0.3);
      border-top: 4px solid #a78bfa;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 10px rgba(167, 139, 250, 0.3);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .api-source {
      font-size: 0.85rem;
      color: #718096;
      margin-top: 20px;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 500;
    }

    .api-indicator {
      width: 10px;
      height: 10px;
      background: #48bb78;
      border-radius: 50%;
      animation: pulse-dot 1.5s ease-in-out infinite;
      box-shadow: 0 0 10px #48bb78;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .error-message {
      color: #feb2b2;
      font-size: 0.9rem;
      margin-top: 15px;
      padding: 12px;
      background: rgba(229, 62, 62, 0.15);
      border-radius: 8px;
      display: none;
      border: 1px solid rgba(229, 62, 62, 0.3);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .swipe-hint {
      position: absolute;
      bottom: 10px;
      right: 15px;
      font-size: 0.75rem;
      color: #a0aec0;
      opacity: 0.7;
      display: none;
      font-weight: 500;
    }

    .fact-card:hover .swipe-hint {
      display: block;
      animation: fadeInOut 3s infinite;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    /* Mobile touch feedback */
    .touch-feedback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(102, 126, 234, 0.3) 0%, transparent 80%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .fact-card:active .touch-feedback {
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .app-container {
        padding: 30px 20px;
        transform: perspective(1000px) rotateX(2deg);
      }
      h1 {
        font-size: 2.2rem;
      }
      .fact-text {
        font-size: 1.1rem;
      }
      .fact-icon {
        font-size: 4rem;
      }
      .refresh-btn {
        padding: 18px 50px;
        font-size: 1rem;
        min-height: 65px;
      }
    }

    @media (max-width: 370px) {
      .fact-text {
        max-width: 280px;
      }
      .refresh-btn {
        padding: 16px 40px;
        font-size: 0.95rem;
      }
    }

    /* Pull to refresh indicator */
    .pull-to-refresh {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 40px;
      border: 3px solid rgba(102, 126, 234, 0.3);
      border-top: 3px solid #a78bfa;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      animation: spin 1s linear infinite;
    }

    .pull-to-refresh.active {
      opacity: 1;
      transform: translateX(-50%) translateY(20px);
    }
  </style>
</head>
<body>
  <div class="pull-to-refresh" id="pull-refresh-indicator"></div>
  <div class="app-container" role="main" aria-label="Daily fun fact generator app">
    <h1>Daily Fun Fact Generator</h1>
    <p class="subtitle">Fresh facts from the internet every time!</p>
    <div class="fact-card" id="fact-card" aria-live="polite" aria-atomic="true">
      <span class="fact-icon" id="fact-icon" aria-hidden="true">🌟</span>
      <div class="fact-category" id="fact-category">Welcome</div>
      <p class="fact-text" id="fact-text">Click the button below to get a fresh fact from the internet!</p>
      <div class="touch-feedback" id="touch-feedback"></div>
      <div class="swipe-hint">← Swipe for new fact →</div>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Fetching fresh fact...</span>
      </div>
    </div>
    <button class="refresh-btn" id="refresh-btn" type="button" aria-label="Get a new fun fact">Get Fresh Fact</button>
    <div class="api-source" id="api-source">
      <div class="api-indicator"></div>
      <span>Live from internet APIs</span>
    </div>
    <div class="error-message" id="error-message"></div>
  </div>

  <script>
    const factCard = document.getElementById('fact-card');
    const iconEl = document.getElementById('fact-icon');
    const categoryEl = document.getElementById('fact-category');
    const textEl = document.getElementById('fact-text');
    const btn = document.getElementById('refresh-btn');
    const loading = document.getElementById('loading');
    const errorMsg = document.getElementById('error-message');
    const touchFeedback = document.getElementById('touch-feedback');
    const pullRefreshIndicator = document.getElementById('pull-refresh-indicator');

    // Multiple API sources for infinite variety
    const apiSources = [
      {
        name: "Facts API",
        url: "https://f-api.ir/api/facts/random",
        parse: (data) => ({
          text: data.fact,
          category: data.category || "General",
          icon: getCategoryIcon(data.category || "General")
        })
      },
      {
        name: "Useless Facts",
        url: "https://uselessfacts.jsph.pl/random.json?language=en",
        parse: (data) => ({
          text: data.text,
          category: "Random",
          icon: "🎲"
        })
      },
      {
        name: "Cat Facts",
        url: "https://catfact.ninja/fact",
        parse: (data) => ({
          text: data.fact,
          category: "Animals",
          icon: "🐱"
        })
      }
    ];

    function getCategoryIcon(category) {
      const icons = {
        "astronomy": "🌌",
        "space": "🚀",
        "biology": "🧬",
        "physics": "⚛️",
        "animals": "🐾",
        "history": "📜",
        "technology": "💻",
        "science": "🔬",
        "nature": "🌿",
        "general": "💡",
        "random": "🎲"
      };
      return icons[category.toLowerCase()] || "✨";
    }

    function fadeOut(element, callback) {
      element.style.opacity = 0;
      setTimeout(callback, 400);
    }

    function fadeIn(element) {
      element.style.opacity = 1;
    }

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
      setTimeout(() => {
        errorMsg.style.display = 'none';
      }, 5000);
    }

    // Haptic feedback functions
    function vibrate(pattern) {
      if ("vibrate" in navigator) {
        navigator.vibrate(pattern);
      }
    }

    function createRipple(e) {
      const button = e.currentTarget;
      const rect = button.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size / 2;
      const y = e.clientY - rect.top - size / 2;
      
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      
      button.appendChild(ripple);
      
      setTimeout(() => ripple.remove(), 600);
    }

    async function fetchFactFromAPI(apiSource) {
      try {
        const response = await fetch(apiSource.url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        return apiSource.parse(data);
      } catch (error) {
        throw new Error(`${apiSource.name}: ${error.message}`);
      }
    }

    async function getNewFact() {
      // Show loading state
      btn.disabled = true;
      loading.style.display = 'flex';
      errorMsg.style.display = 'none';

      // Haptic feedback for loading
      vibrate(50);

      try {
        // Try APIs in random order for variety
        const shuffledAPIs = [...apiSources].sort(() => Math.random() - 0.5);
        let fact = null;
        let lastError = null;

        for (const api of shuffledAPIs) {
          try {
            fact = await fetchFactFromAPI(api);
            break;
          } catch (error) {
            lastError = error;
            continue;
          }
        }

        if (!fact) {
          throw new Error(lastError?.message || "All APIs failed");
        }

        // Update the fact with fade animation
        fadeOut(factCard, () => {
          iconEl.textContent = fact.icon;
          categoryEl.textContent = fact.category;
          textEl.textContent = fact.text;

          // Change button text after first click
          if (btn.textContent === 'Get Fresh Fact') {
            btn.textContent = 'Get Another Fact';
          }

          fadeIn(factCard);
        });

        // Success haptic feedback
        vibrate([100, 50, 100]);

      } catch (error) {
        showError(`Failed to fetch fact: ${error.message}`);

        // Show fallback message
        fadeOut(factCard, () => {
          iconEl.textContent = '⚠️';
          categoryEl.textContent = 'Connection Issue';
          textEl.textContent = 'Unable to fetch fresh facts right now. Please check your internet connection and try again.';
          fadeIn(factCard);
        });

        // Error haptic feedback
        vibrate([300, 100, 300]);
      } finally {
        // Hide loading and re-enable button
        setTimeout(() => {
          loading.style.display = 'none';
          btn.disabled = false;
        }, 800);
      }
    }

    // Load a fact on page load
    window.addEventListener('DOMContentLoaded', getNewFact);

    // Get new fact on button click
    btn.addEventListener('click', getNewFact);

    // Touch ripple effect for button
    btn.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = touch.clientX - rect.left - size / 2;
      const y = touch.clientY - rect.top - size / 2;
      
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });

    // Keyboard support for accessibility
    window.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'Enter') && !btn.disabled) {
        e.preventDefault();
        getNewFact();
      }
    });

    // Mobile swipe gesture support
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;
    let isPulling = false;
    let pullStartY = 0;

    // Touch feedback for fact card
    factCard.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      const rect = factCard.getBoundingClientRect();
      const x = ((touchStartX - rect.left) / rect.width) * 100;
      const y = ((touchStartY - rect.top) / rect.height) * 100;
      touchFeedback.style.setProperty('--x', x + '%');
      touchFeedback.style.setProperty('--y', y + '%');
      factCard.classList.add('active');
    });

    factCard.addEventListener('touchmove', (e) => {
      touchEndX = e.touches[0].clientX;
      touchEndY = e.touches[0].clientY;
      
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      
      // Pull-to-refresh detection
      if (window.scrollY === 0 && deltaY > 50 && Math.abs(deltaX) < 30) {
        if (!isPulling) {
          isPulling = true;
          pullStartY = touchStartY;
          pullRefreshIndicator.classList.add('active');
          vibrate(20);
        }
      }
      
      // Swipe gesture with visual feedback
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 20) {
        factCard.style.transform = `translateX(${deltaX * 0.3}px) rotate(${deltaX * 0.05}deg)`;
        factCard.style.opacity = Math.max(0.5, 1 - Math.abs(deltaX) / 300);
      }
    });

    factCard.addEventListener('touchend', (e) => {
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      const minSwipeDistance = 100;
      
      factCard.style.transform = '';
      factCard.style.opacity = '';
      factCard.classList.remove('active');
      
      // Pull-to-refresh action
      if (isPulling && deltaY > 100) {
        pullRefreshIndicator.classList.remove('active');
        getNewFact();
        isPulling = false;
        return;
      }
      
      pullRefreshIndicator.classList.remove('active');
      isPulling = false;
      
      // Swipe gesture detection
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minSwipeDistance) {
        if (deltaX > 0) {
          factCard.classList.add('swipe-right');
        } else {
          factCard.classList.add('swipe-left');
        }
        
        vibrate(30);
        
        setTimeout(() => {
          factCard.classList.remove('swipe-left', 'swipe-right');
          getNewFact();
        }, 600);
      }
      
      touchStartX = 0;
      touchStartY = 0;
      touchEndX = 0;
      touchEndY = 0;
    });

    // Button touch feedback
    btn.addEventListener('touchstart', () => {
      vibrate(30);
      btn.style.transform = 'translateY(-2px) scale(0.95)';
    });

    btn.addEventListener('touchend', () => {
      btn.style.transform = '';
    });

    // Prevent scrolling when swiping on fact card
    document.addEventListener('touchmove', (e) => {
      if (e.target.closest('.fact-card')) {
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 20) {
          e.preventDefault();
        }
      }
    }, { passive: false });
  </script>
</body>
</html>
